services:
  dnsmasq:
    build:
      context: ./dnsmasq
      dockerfile: Dockerfile
    container_name: awg-dnsmasq
    network_mode: service:awg
    depends_on:
      - awg
    restart: unless-stopped
    volumes:
      - ./dnsmasq/dnsmasq.conf:/etc/dnsmasq.conf:ro
      - ./dnsmasq/lists:/etc/dnsmasq.d/lists:ro

  awg:
    build:
      context: ./awg
      dockerfile: Dockerfile
    container_name: awg-core
    restart: unless-stopped
    ports:
      - "5060:5060/udp"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      AWG_INTERFACE: awg0
      AWG_LISTEN_PORT: 5060
      AWG_ADDRESS: 10.80.0.1/16
      AWG_MTU: 1280
      AWG_DNS: 10.80.0.1
      AWG_TABLE: off
      AWG_RATE_LIMIT_MBIT: "15"
      AWG_WHITELIST_RATE_MBIT: "200"
      AWG_UNLIMITED_RATE_MBIT: "1000"
      AWG_H1: "633538146-633583257"
      AWG_H2: "1599578118-1599613680"
      AWG_H3: "2660622966-2660645695"
      AWG_H4: "4051736197-4051752709"
      AWG_S1: "79"
      AWG_S2: "97"
      AWG_S3: "16"
      AWG_S4: "29"
      AWG_JC: "5"
      AWG_JMIN: "235"
      AWG_JMAX: "330"
      AWG_I1: "<b 0x5245474953544552207369703a7374756e2e7369706e65742e727520bbd22468><rc 28><t><r 22>"
      AWG_I2: "<rc 11><r 260><t><rd 6>"
      AWG_I3: "<t><r 20><rc 4><rd 5>"
      AWG_I4: "<rd 8><rc 9><r 15><t>"
      AWG_I5: "<r 346><t><rc 6><rd 8>"
      AWG_CLIENT_PERSISTENT_KEEPALIVE: "25"
    volumes:
      - ./awg/data:/etc/amnezia/amneziawg
      - ./awg/scripts:/opt/awg/scripts
    networks:
      - awg-net

  postgres:
    image: postgres:16-alpine
    container_name: amnezia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amnezia_bot}
      POSTGRES_USER: ${POSTGRES_USER:-bot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password_change_me}
    volumes:
      - ./bot/data/db:/var/lib/postgresql/data
    networks:
      - awg-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bot_user} -d ${POSTGRES_DB:-amnezia_bot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: amnezia-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      awg:
        condition: service_started
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-amnezia_bot}
      POSTGRES_USER: ${POSTGRES_USER:-bot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password_change_me}
      AWG_INTERFACE: awg0
      AWG_LISTEN_PORT: 5060
      AWG_SUBNET: 10.80.0.1/16
      AWG_DNS: 10.80.0.1
      AWG_CONTAINER_NAME: awg-core
      SCRIPTS_DIR: /app/scripts
      CONFIGS_DIR: /etc/amnezia/amneziawg/clients
      DEFAULT_RATE_LIMIT: ${DEFAULT_RATE_LIMIT:-15}
      EXPIRATION_DAYS: ${EXPIRATION_DAYS:-30}
      NOTIFICATION_DAYS: ${NOTIFICATION_DAYS:-3}
      AMNEZIA_BACKUP_TEMPLATE_PATH: /app/instructions/AmneziaVPN.backup
    volumes:
      - ./bot/src:/app/src
      - ./awg/scripts:/app/scripts:ro
      - ./awg/data:/etc/amnezia/amneziawg
      - /home/docker/amnezia-wg-bot/instructions:/app/instructions:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - awg-net

networks:
  awg-net:
    driver: bridge
